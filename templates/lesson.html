<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leçon - CapInvest Academy</title>
    <link rel="stylesheet" href="/static/css/main.css?v=9">
    <style>
        .lesson-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .lesson-header {
            margin-bottom: 2rem;
        }

        .lesson-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .lesson-meta {
            display: flex;
            gap: 1.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .content-section,
        .quiz-section,
        .results-section {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .lesson-content {
            line-height: 1.8;
            margin-bottom: 1.5rem;
        }

        .lesson-content p {
            margin-bottom: 1rem;
        }

        .lesson-content ul {
            margin: 0.75rem 0 1rem 1.5rem;
            padding: 0;
        }

        .lesson-content li {
            margin-bottom: 0.5rem;
            line-height: 1.7;
        }

        .lesson-content strong {
            color: var(--primary);
            font-weight: 700;
        }

        .lesson-example {
            background: var(--primary-bg);
            border-left: 4px solid var(--primary);
            padding: 1rem 1.5rem;
            border-radius: 4px;
            margin-top: 1rem;
        }

        .lesson-example-title {
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--primary);
        }

        .question-block {
            margin-bottom: 2rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--border);
        }

        .question-block:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .question-prompt {
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .question-choices {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .choice-option {
            display: flex;
            align-items: center;
            padding: 1rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .choice-option:hover {
            border-color: var(--primary);
            background: var(--primary-bg);
        }

        .choice-option input[type="radio"] {
            margin-right: 0.75rem;
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .choice-option label {
            cursor: pointer;
            flex: 1;
        }

        .submit-button {
            width: 100%;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .submit-button:hover:not(:disabled) {
            background: var(--secondary);
        }

        .submit-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result-card {
            margin-bottom: 1.5rem;
            padding: 1rem;
            border-radius: 8px;
            border: 2px solid;
        }

        .result-card.correct {
            background: var(--success-bg);
            border-color: var(--success);
        }

        .result-card.incorrect {
            background: var(--danger-bg);
            border-color: var(--danger);
        }

        .result-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .result-header.correct {
            color: #86EFAC;
        }

        .result-header.incorrect {
            color: #F87171;
        }

        .result-explanation {
            margin-top: 0.75rem;
            line-height: 1.6;
        }

        .score-display {
            text-align: center;
            padding: 2rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border-radius: 12px;
            margin-bottom: 2rem;
        }

        .score-value {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .score-label {
            font-size: 1.1rem;
            opacity: 0.95;
        }

        .xp-earned {
            display: inline-block;
            background: #EAB308;
            color: #1A1714;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 600;
            margin-top: 1rem;
        }

        .action-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .action-buttons button {
            flex: 1;
            padding: 1rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-primary-action {
            background: var(--primary);
            color: white;
        }

        .btn-secondary-action {
            background: var(--card-bg);
            border: 2px solid var(--primary);
            color: var(--primary);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--primary);
            text-decoration: none;
            margin-bottom: 2rem;
            font-weight: 500;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }
    </style>
</head>

<body>
    <!-- Radial Gradient + Particles Background -->
    <canvas id="particles-bg" aria-hidden="true"></canvas>
    <style>
        #particles-bg {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .navbar    { position: sticky; z-index: 1000; }
        .container { position: relative; z-index: 1; }
        .card, .modal-content, .auth-container { position: relative; z-index: 1; }
    </style>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/espace_perso.html" class="nav-brand">
                <img src="/static/images/capinvest_logo.png" alt="Logo" class="nav-logo">
                <span>CapInvest</span>
            </a>
            <div class="nav-links">
                <a href="/espace_perso.html">Tableau de Bord</a>
                <a href="/explorer.html">Explorer</a>
                <a href="/nouvel_invest.html">Nouvel Investissement</a>
                <a href="/suivi_invest.html">Suivi</a>
                <a href="/academy.html" class="active">Academy</a>
                <a href="#" onclick="api.logout()">Déconnexion</a>
            </div>
        </div>
    </nav>

    <div class="container" style="margin-top: 2rem;">
        <div class="lesson-container">
            <a href="#" id="back-link" class="back-link">
                ← Retour au module
            </a>

            <div id="content-area">
                <div class="loading">Chargement de la leçon...</div>
            </div>
        </div>
    </div>

    <script src="/static/js/api.js"></script>
    <script>
        if (!api.isAuthenticated()) {
            window.location.href = '/login.html';
        }

        const params = new URLSearchParams(window.location.search);
        const lessonId = params.get('id');

        if (!lessonId) {
            window.location.href = '/academy.html';
        }

        let lesson = null;
        let answers = {};

        async function loadLesson() {
            try {
                lesson = await api.get(`/api/training/lessons/${lessonId}`);
                document.getElementById('back-link').href = `/module.html?id=${lesson.module_id}`;
                renderLesson();
            } catch (error) {
                console.error('Error loading lesson:', error);
                document.getElementById('content-area').innerHTML =
                    '<div class="loading">Erreur de chargement. <a href="/academy.html">Retour</a></div>';
            }
        }

        function parseMarkdown(text) {
            if (!text) return '';

            // Process line by line for reliable cross-browser support
            const lines = text.split('\n');
            const result = [];
            let inList = false;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i];

                // Apply inline formatting first (bold, italic)
                line = line.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                line = line.replace(/\*([^*]+)\*/g, '<em>$1</em>');

                // Bullet point line (starts with • or -)
                if (/^[•\-] /.test(line)) {
                    if (!inList) {
                        result.push('<ul>');
                        inList = true;
                    }
                    result.push('<li>' + line.replace(/^[•\-] /, '') + '</li>');
                }
                // Numbered list line (starts with 1. 2. etc.)
                else if (/^\d+\. /.test(line)) {
                    if (!inList) {
                        result.push('<ul>');
                        inList = true;
                    }
                    result.push('<li>' + line.replace(/^\d+\. /, '') + '</li>');
                }
                // Empty line = paragraph break
                else if (line.trim() === '') {
                    if (inList) {
                        result.push('</ul>');
                        inList = false;
                    }
                    result.push('</p><p>');
                }
                // Normal line
                else {
                    if (inList) {
                        result.push('</ul>');
                        inList = false;
                    }
                    result.push(line);
                }
            }

            if (inList) result.push('</ul>');

            return result.join('\n');
        }

        function renderLesson() {
            const html = `
                <div class="lesson-header">
                    <h1 class="lesson-title">${lesson.title}</h1>
                    <div class="lesson-meta">
                        <span>⏱️ ${lesson.estimated_minutes} min</span>
                        <span>⭐ ${lesson.xp_reward} XP</span>
                    </div>
                </div>

                <div class="content-section">
                    <div class="section-title">📖 Contenu de la leçon</div>
                    <div class="lesson-content"><p>${parseMarkdown(lesson.content)}</p></div>
                    ${lesson.example ? `
                        <div class="lesson-example">
                            <div class="lesson-example-title">💡 Exemple concret</div>
                            <div>${parseMarkdown(lesson.example)}</div>
                        </div>
                    ` : ''}
                </div>

                <div class="quiz-section" id="quiz-section">
                    <div class="section-title">❓ Quiz</div>
                    ${lesson.questions.map(renderQuestion).join('')}
                    <button class="submit-button" onclick="submitAnswers()">Valider mes réponses</button>
                </div>

                <div class="results-section" id="results-section" style="display: none;">
                    <!-- Results will be shown here -->
                </div>
            `;

            document.getElementById('content-area').innerHTML = html;
        }

        function renderQuestion(question) {
            if (question.type === 'multiple_choice') {
                return `
                    <div class="question-block">
                        <div class="question-prompt">${question.order}. ${question.prompt}</div>
                        <div class="question-choices">
                            ${question.choices.map((choice, idx) => {
                    // Only escape double quotes for the HTML attribute, don't use backslashes
                    const htmlSafeChoice = choice.replace(/"/g, '&quot;');
                    return `
                                    <div class="choice-option">
                                        <input type="radio" name="q${question.id}" id="q${question.id}_${idx}" 
                                            value="${htmlSafeChoice}" onchange="recordAnswer(${question.id}, this.value)">
                                        <label for="q${question.id}_${idx}">${choice}</label>
                                    </div>
                                `;
                }).join('')}
                        </div>
                    </div>
                `;
            } else if (question.type === 'true_false') {
                return `
                    <div class="question-block">
                        <div class="question-prompt">${question.order}. ${question.prompt}</div>
                        <div class="question-choices">
                            <div class="choice-option">
                                <input type="radio" name="q${question.id}" id="q${question.id}_true" 
                                    value="true" onchange="recordAnswer(${question.id}, 'true')">
                                <label for="q${question.id}_true">Vrai</label>
                            </div>
                            <div class="choice-option">
                                <input type="radio" name="q${question.id}" id="q${question.id}_false" 
                                    value="false" onchange="recordAnswer(${question.id}, 'false')">
                                <label for="q${question.id}_false">Faux</label>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        function recordAnswer(questionId, answer) {
            answers[questionId] = answer;
        }

        async function submitAnswers() {
            if (Object.keys(answers).length < lesson.questions.length) {
                alert('Veuillez répondre à toutes les questions avant de valider.');
                return;
            }

            try {
                const result = await api.post(`/api/training/lessons/${lessonId}/submit`, { answers });
                displayResults(result);
            } catch (error) {
                console.error('Error submitting answers:', error);
                alert('Erreur lors de la soumission. Veuillez réessayer.');
            }
        }

        function displayResults(result) {
            document.getElementById('quiz-section').style.display = 'none';

            const passedClass = result.percentage >= 70 ? 'correct' : 'incorrect';
            const passedEmoji = result.percentage >= 70 ? '🎉' : '😕';
            const passedText = result.percentage >= 70 ? 'Félicitations !' : 'Encore un effort !';

            const html = `
                <div class="score-display">
                    <div class="score-value">${passedEmoji} ${result.percentage}%</div>
                    <div class="score-label">${passedText} Vous avez répondu correctement à ${result.score}/${result.total_questions} questions</div>
                    ${result.xp_earned > 0 ? `<div class="xp-earned">⭐ +${result.xp_earned} XP</div>` : ''}
                </div>

                <div class="section-title">📊 Détails de vos réponses</div>
                ${result.results.map((r, idx) => `
                    <div class="result-card ${r.correct ? 'correct' : 'incorrect'}">
                        <div class="result-header ${r.correct ? 'correct' : 'incorrect'}">
                            ${r.correct ? '✅ Correct' : '❌ Incorrect'} - Question ${idx + 1}
                        </div>
                        <div>Votre réponse : <strong>${r.user_answer}</strong></div>
                        ${!r.correct ? `<div>Réponse correcte : <strong>${r.correct_answer}</strong></div>` : ''}
                        <div class="result-explanation">${r.explanation}</div>
                    </div>
                `).join('')}

                <div class="action-buttons">
                    <button class="btn-secondary-action" onclick="window.location.href='/module.html?id=${lesson.module_id}'">
                        Retour au module
                    </button>
                    <button class="btn-primary-action" onclick="window.location.href='/academy.html'">
                        Retour à l'Academy
                    </button>
                </div>
            `;

            document.getElementById('results-section').innerHTML = html;
            document.getElementById('results-section').style.display = 'block';
        }

        loadLesson();
    </script>

    <script>
    /* Floating particles */
    (function () {
        var canvas = document.getElementById('particles-bg');
        if (!canvas) return;
        var ctx = canvas.getContext('2d');
        var W, H, dots = [];
        var COUNT = 45;
        function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
        function init() {
            dots = [];
            for (var i = 0; i < COUNT; i++) {
                dots.push({ x: Math.random()*W, y: Math.random()*H,
                    r: Math.random()*1.8+0.8, vx: (Math.random()-0.5)*0.18,
                    vy: (Math.random()-0.5)*0.18, alpha: Math.random()*0.35+0.1 });
            }
        }
        function loop() {
            ctx.clearRect(0,0,W,H);
            for (var i=0;i<dots.length;i++) {
                var d=dots[i]; d.x+=d.vx; d.y+=d.vy;
                if(d.x<0||d.x>W)d.vx*=-1; if(d.y<0||d.y>H)d.vy*=-1;
                ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,Math.PI*2);
                ctx.fillStyle='rgba(74,144,164,'+d.alpha+')'; ctx.fill();
            }
            requestAnimationFrame(loop);
        }
        window.addEventListener('resize',function(){resize();init()});
        resize(); init(); loop();
    })();
    </script>
</body>

</html>
