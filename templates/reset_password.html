<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CapInvest - Réinitialisation du Mot de Passe</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 2rem;
            z-index: 10;
        }

        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 3rem 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            text-align: left;
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            box-sizing: border-box;
            outline: none;
            transition: all 0.2s;
        }

        .form-group input:focus {
            border-color: #4A90A4;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(74, 144, 164, 0.2);
        }

        .btn {
            width: 100%;
            padding: 0.75rem;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
            font-family: inherit;
        }

        .btn-primary {
            background: #4A90A4;
            color: white;
            box-shadow: 0 4px 12px rgba(74, 144, 164, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(74, 144, 164, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
        }
    </style>
</head>

<body>
    <canvas id="particles-bg"
        style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none;"></canvas>

    <div class="container">
        <div class="card" id="reset-card">
            <div id="reset-form-container">
                <h2 style="margin-bottom: 0.5rem; color: #4A90A4;">Nouveau mot de passe</h2>
                <p style="color: #94a3b8; margin-bottom: 2rem; font-size: 0.95rem;">Choisissez un mot de passe robuste
                    d'au moins 8 caractères.</p>

                <div id="error-container"
                    style="display: none; padding: 0.75rem; background-color: #fee2e2; border-radius: 8px; color: #b91c1c; margin-bottom: 1.5rem; font-size: 0.85rem; border-left: 4px solid #ef4444;">
                </div>

                <form id="reset-form" onsubmit="handleReset(event)" novalidate>
                    <div class="form-group">
                        <label for="new-password">Nouveau mot de passe</label>
                        <input type="password" id="new-password" required placeholder="••••••••">
                    </div>
                    <div class="form-group">
                        <label for="confirm-password">Confirmer le mot de passe</label>
                        <input type="password" id="confirm-password" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn btn-primary" id="submit-btn">Réinitialiser le mot de passe</button>
                </form>
            </div>

            <div id="success-view" style="display: none; text-align: center;">
                <div class="status-icon">
                    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </div>
                <h2 style="color: #4A90A4; margin-bottom: 1rem;">C'est fait !</h2>
                <p style="color: #94a3b8; line-height: 1.6;">Votre mot de passe a été réinitialisé avec succès. Vous
                    pouvez maintenant vous connecter en toute sécurité.</p>
                <a href="/login.html" class="btn btn-primary"
                    style="display: block; margin-top: 2rem; text-decoration: none; box-sizing: border-box;">Se
                    connecter</a>
            </div>
        </div>
    </div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/ui.js"></script>
    <script>
        async function handleReset(e) {
            e.preventDefault();
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const errorBox = document.getElementById('error-container');
            const submitBtn = document.getElementById('submit-btn');

            if (!token) {
                errorBox.textContent = "Token de réinitialisation manquant.";
                errorBox.style.display = 'block';
                return;
            }

            errorBox.style.display = 'none';

            if (newPassword !== confirmPassword) {
                errorBox.textContent = "Les mots de passe ne correspondent pas.";
                errorBox.style.display = 'block';
                return;
            }

            if (newPassword.length < 8) {
                errorBox.textContent = "Le mot de passe doit faire au moins 8 caractères.";
                errorBox.style.display = 'block';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Réinitialisation en cours...';

            try {
                await api.post('/auth/reset-password', {
                    token: token,
                    new_password: newPassword
                });
                document.getElementById('reset-form-container').style.display = 'none';
                document.getElementById('success-view').style.display = 'block';
                // Global UI toast might not be visible here if ui.js isn't fully set up in this standalone page, 
                // but success view handles the feedback.
            } catch (err) {
                errorBox.textContent = err.message || "Une erreur est survenue lors de la réinitialisation.";
                errorBox.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Réinitialiser le mot de passe';
            }
        }

        /* Floating particles */
        (function () {
            var canvas = document.getElementById('particles-bg');
            if (!canvas) return;
            var ctx = canvas.getContext('2d');
            var W, H, dots = [];
            var COUNT = 40;
            function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
            function init() { dots = []; for (var i = 0; i < COUNT; i++) dots.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 2 + 1, vx: (Math.random() - 0.5) * 0.2, vy: (Math.random() - 0.5) * 0.2, alpha: Math.random() * 0.4 + 0.1 }); }
            function loop() { ctx.clearRect(0, 0, W, H); for (var i = 0; i < dots.length; i++) { var d = dots[i]; d.x += d.vx; d.y += d.vy; if (d.x < 0 || d.x > W) d.vx *= -1; if (d.y < 0 || d.y > H) d.vy *= -1; ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fillStyle = 'rgba(74,144,164,' + d.alpha + ')'; ctx.fill(); } requestAnimationFrame(loop); }
            window.addEventListener('resize', function () { resize(); init(); });
            resize(); init(); loop();
        })();
    </script>
</body>

</html>
