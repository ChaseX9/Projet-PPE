name: Scheduled Data Update

on:
  schedule:
    - cron: '0 4 */2 * *' # Every 2 days at 4:00 AM UTC
  workflow_dispatch: # Allows manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          
      - name: Run data update script
        run: python scripts/bot_update_cycle.py
        
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/universe.csv data/explorer_cache.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto-update financial universe and explorer cache [skip ci]" && git push)
